<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cupe de Cafea Mocha - pagină de test</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #FFF4D6; color: #3B2412; font-family: Georgia, "Times New Roman", serif; }
  header { position: absolute; top: 0; left: 0; padding: 12px 16px; }
  .logo { width: 80px; height: 40px; background: #3B2412; color: #FFF4D6; font: 700 16px/40px Arial, sans-serif; text-align: center; border-radius: 6px; }
  .hero { min-height: 100vh; display: flex; align-items: center; justify-content: space-between; gap: 32px; padding: 96px 64px 48px; position: relative; }
  .hero-text { max-width: 560px; }
  h1 { font-size: 56px; line-height: 1.05; margin: 0 0 16px; }
  .sub { font: 400 20px/1.5 Verdana, sans-serif; margin: 0 0 28px; }
  .cta { display: inline-block; background: #C2410C; color: #FFFFFF; font: 700 18px Arial, sans-serif; padding: 16px 32px; border-radius: 10px; text-decoration: none; }
  .badge { position: absolute; top: 96px; right: 64px; background: #7C2D12; color: #FFF4D6; font: 700 18px/1.3 Arial, sans-serif; padding: 14px 20px; border-radius: 999px; max-width: 260px; text-align: center; }
  .mascot { width: 320px; height: 320px; flex: none; }
  footer { background: #3B2412; color: #FFF4D6; padding: 32px 64px; font: 400 14px Verdana, sans-serif; }
</style>
</head>
<body>
<header><div class="logo">Mocha</div></header>
<main>
  <section class="hero">
    <div class="hero-text">
      <h1>Cupe pentru dimineți lente</h1>
      <p class="sub">Ceramică făcută manual, glazurată în culori calde, pentru cafeaua ta de fiecare zi.</p>
      <a class="cta" href="#comanda">Comandă acum</a>
    </div>
    <div class="badge">-20% la toate cupele, 49 lei</div>
    <svg class="mascot" viewBox="0 0 320 320" role="img" aria-label="Mascota Mocha, o cană zâmbitoare">
      <ellipse cx="160" cy="290" rx="110" ry="14" fill="#3B2412" opacity="0.2"/>
      <path d="M60 90h180v110a90 90 0 0 1-90 90h0a90 90 0 0 1-90-90z" fill="#E0A458" stroke="#3B2412" stroke-width="8"/>
      <path d="M240 120h20a35 35 0 0 1 0 70h-24" fill="none" stroke="#3B2412" stroke-width="8"/>
      <circle cx="120" cy="170" r="10" fill="#3B2412"/>
      <circle cx="180" cy="170" r="10" fill="#3B2412"/>
      <path d="M125 210q25 25 50 0" fill="none" stroke="#3B2412" stroke-width="7" stroke-linecap="round"/>
      <path d="M110 70q-10-25 5-40M160 70q-10-25 5-40M210 70q-10-25 5-40" fill="none" stroke="#C2410C" stroke-width="6" stroke-linecap="round"/>
    </svg>
  </section>
</main>
<footer>Mocha Ceramică, Str. Argilei 7, București. Livrare în 3 zile.</footer>
</body>
</html>
