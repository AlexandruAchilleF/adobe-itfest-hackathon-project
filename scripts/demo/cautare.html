<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>camping poster – Căutare Google</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1f1f1f; }
  /* captura e fundal, nu <img>: scanarea Spire trebuie să găsească un singur element, afișul */
  #captura { position: relative; width: 100vw; aspect-ratio: 2000 / 1141; background: url(/demo/cautare-google.png) 0 0 / 100% auto no-repeat; }
  /* peste previzualizarea Pinterest: x 1375–1803, y 203–853 din 2000×1141 */
  #captura img { position: absolute; left: 68.75%; top: 17.791%; width: 21.4%; height: 56.968%; display: block; }
</style>
</head>
<body>
<div id="captura"><img src="/demo/referinta-camping.png" alt="Camping Adventure Poster"></div>
</body>
</html>
